<tr id="task-{{ task.id }}" class="row-priority-{{ task.priority.value }}{% if task.status.value in ['done', 'dropped'] %} opacity-50{% endif %}">
  <td class="min-w-0">
    <div class="min-w-0 break-words">
      <a class="link link-hover font-medium" hx-get="/gui/tasks/{{ task.id }}/detail" hx-target="#task-{{ task.id }}-detail" hx-swap="innerHTML" href="#">{{ task.title }}</a>
    </div>
    <div id="task-{{ task.id }}-detail"></div>
  </td>
  <td>
    <div class="flex flex-wrap gap-1 min-w-0">
      {% for tag in task.tags %}
      <span class="pillbox{% if not tag.color %} pillbox-no-color{% endif %}" {% if tag.color %}style="{{ tag.color | pillbox_style }}"{% endif %} {% if tag.description %}title="{{ tag.description }}"{% endif %}>{{ tag.name }}</span>
      {% endfor %}
    </div>
  </td>
  <td>{{ task.assignee.name if task.assignee else "—" }}</td>
  <td><span class="badge badge-outline badge-sm {% if task.priority.value == 'critical' %}badge-error{% elif task.priority.value == 'high' %}badge-warning{% endif %}">{{ task.priority.value }}</span></td>
  <td class="{% if task.due_date and task.due_date < today and task.status.value not in ['done', 'dropped'] %}text-error font-semibold{% endif %}">{{ task.due_date.isoformat() if task.due_date else "—" }}</td>
  <td>
    <select class="select select-bordered select-xs status-{{ task.status.value }}" name="status"
            hx-post="/gui/tasks/{{ task.id }}/status" hx-target="#task-{{ task.id }}" hx-swap="outerHTML">
      {% for s in statuses %}
      <option value="{{ s.value }}" {% if s == task.status %}selected{% endif %}>{{ s.value }}</option>
      {% endfor %}
    </select>
  </td>
  <td class="whitespace-nowrap">
    {% if task.status.value not in ['done', 'dropped'] %}
    <button class="btn btn-xs btn-success" hx-post="/gui/tasks/{{ task.id }}/status" hx-vals='{"status": "done"}' hx-target="#task-{{ task.id }}" hx-swap="outerHTML" title="Done">✓</button>
    {% endif %}
    <button class="btn btn-xs" hx-get="/gui/tasks/{{ task.id }}/edit" hx-target="#task-{{ task.id }}" hx-swap="outerHTML">edit</button>
  </td>
</tr>
