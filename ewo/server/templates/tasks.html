{% extends "_layout.html" %}
{% block content %}
<div class="grid gap-6">

  <section class="card bg-base-100 shadow">
    <div class="card-body">
      <h2 class="card-title">Add task</h2>
      <form hx-post="/gui/tasks" hx-target="#task-list" hx-on::after-request="this.reset()" class="flex flex-wrap gap-2">
        <input class="input input-bordered flex-1 min-w-64" name="title" placeholder="Task title" required>
        <select class="select select-bordered" name="priority">
          {% for p in priorities %}<option value="{{ p.value }}" {% if p.value == 'normal' %}selected{% endif %}>{{ p.value }}</option>{% endfor %}
        </select>
        <select class="select select-bordered" name="assignee_id">
          <option value="">(unassigned)</option>
          {% for person in people %}<option value="{{ person.id }}">{{ person.name }}{% if person.is_self %} (me){% endif %}</option>{% endfor %}
        </select>
        <input class="input input-bordered" type="date" name="due_date">
        <input class="input input-bordered" name="tags" placeholder="tags, comma separated">
        <button class="btn btn-primary" type="submit">Add</button>
      </form>
    </div>
  </section>

  <section class="card bg-base-100 shadow">
    <div class="card-body">
      <div class="flex flex-wrap items-center gap-2">
        <h2 class="card-title flex-1">Tasks</h2>
        {% if llm_enabled %}
        <button class="btn btn-sm" hx-post="/gui/tasks/organize" hx-target="#organize-result" hx-indicator="#organize-spinner" title="AI proposals: merge, split, create, retitle">
          Organize (AI) <span id="organize-spinner" class="htmx-indicator loading loading-spinner loading-sm"></span>
        </button>
        <form hx-post="/gui/tasks/organize/topic" hx-target="#organize-result" hx-indicator="#organize-spinner" hx-on::after-request="this.reset()" class="flex gap-1">
          <input class="input input-bordered input-sm w-44" name="topic" placeholder="Group by topic…" required>
          <button class="btn btn-sm" type="submit" title="Find tasks about a topic and group them under a parent">Group topic (AI)</button>
        </form>
        {% endif %}
        <form hx-get="/gui/tasks" hx-target="#task-list" hx-trigger="change" class="flex flex-wrap gap-2">
          <span class="text-sm self-center opacity-70">Sort:</span>
          <select class="select select-bordered select-sm" name="sort">
            {% for f in sort_fields %}<option value="{{ f }}" {% if filters.sort == f %}selected{% endif %}>{{ f | replace('_', ' ') }}</option>{% endfor %}
          </select>
          <select class="select select-bordered select-sm" name="sort2">
            {% for f in sort_fields %}<option value="{{ f }}" {% if filters.sort2 == f %}selected{% endif %}>{{ f | replace('_', ' ') }}</option>{% endfor %}
          </select>
          <label class="label cursor-pointer gap-1 text-sm">
            <input type="checkbox" class="checkbox checkbox-sm" name="reverse" value="true" {% if filters.reverse %}checked{% endif %}> reverse
          </label>
          <select class="select select-bordered select-sm" name="status">
            <option value="">any open status</option>
            {% for s in statuses %}<option value="{{ s.value }}" {% if filters.status == s.value %}selected{% endif %}>{{ s.value }}</option>{% endfor %}
          </select>
          <select class="select select-bordered select-sm" name="assignee">
            <option value="">anyone</option>
            {% for person in people %}<option value="{{ person.id }}" {% if filters.assignee == person.id|string %}selected{% endif %}>{{ person.name }}</option>{% endfor %}
          </select>
          <select class="select select-bordered select-sm" name="source">
            <option value="">any source</option>
            {% for s in sources %}<option value="{{ s.value }}" {% if filters.source == s.value %}selected{% endif %}>{{ s.value }}</option>{% endfor %}
          </select>
          <div class="dropdown">
            <div tabindex="0" role="button" class="btn btn-sm">Labels{% if filters.tags %} ({{ filters.tags | length }}){% endif %}</div>
            <div tabindex="0" class="dropdown-content z-10 menu p-2 shadow bg-base-100 rounded-box w-52 max-h-64 overflow-y-auto">
              {% for t in all_tags %}
              <label class="label cursor-pointer justify-start gap-2 py-1">
                <input type="checkbox" class="checkbox checkbox-sm" name="tags" value="{{ t.name }}" {% if t.name in filters.tags %}checked{% endif %}>
                <span class="label-text" {% if t.description %}title="{{ t.description }}"{% endif %}>{{ t.name }}</span>
              </label>
              {% else %}
              <span class="text-sm opacity-60 px-2">No labels yet</span>
              {% endfor %}
            </div>
          </div>
          <span class="text-sm self-center">Show tasks with:</span>
          <label class="label cursor-pointer gap-1 text-sm">
            <input type="radio" class="radio radio-sm" name="tag_match" value="any" {% if filters.tag_match != 'all' %}checked{% endif %}> any selected label
          </label>
          <label class="label cursor-pointer gap-1 text-sm">
            <input type="radio" class="radio radio-sm" name="tag_match" value="all" {% if filters.tag_match == 'all' %}checked{% endif %}> all selected labels
          </label>
          <label class="label cursor-pointer gap-1 text-sm">
            <input type="checkbox" class="checkbox checkbox-sm" name="include_closed" value="true" {% if filters.include_closed %}checked{% endif %}> closed too
          </label>
        </form>
      </div>
      <div id="organize-result"></div>
      <div id="tag-sync-banner"></div>
      <div id="related-banner"></div>
      <div id="task-list">
        {% include "_tasks.html" %}
      </div>
    </div>
  </section>

</div>
{% endblock %}
