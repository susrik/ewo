{% if error %}
<div class="alert alert-warning py-2 text-sm mt-2"><span>{{ error }}</span></div>
{% elif not proposals %}
<p class="opacity-60 text-sm mt-2">No organization suggestions right now.</p>
{% else %}
<form hx-post="/gui/tasks/organize/apply" hx-target="#task-list" class="grid gap-2 mt-2">
  <input type="hidden" name="proposals_json" value="{{ proposals_json }}">
  {% for p in proposals %}
  <label class="border rounded p-3 flex flex-wrap items-center gap-2 cursor-pointer">
    <input type="checkbox" class="checkbox checkbox-sm" name="selected" value="{{ loop.index0 }}" checked>
    <span class="badge badge-sm {% if p.kind == 'merge' %}badge-warning{% elif p.kind == 'split' %}badge-info{% elif p.kind == 'create' %}badge-success{% else %}badge-ghost{% endif %}">{{ p.kind }}</span>
    <span class="flex-1 text-sm">
      {% if p.kind == 'merge' %}Merge #{{ p.from_id }} into #{{ p.into_id }}
      {% elif p.kind == 'split' %}Split {{ p.nugget_ids | length }} nugget(s) off #{{ p.task_id }} into “{{ p.title }}”
      {% elif p.kind == 'create' %}Create “{{ p.title }}” from {{ p.nugget_ids | length }} nugget(s)
      {% else %}Retitle #{{ p.task_id }} to “{{ p.title }}”{% endif %}
      {% if p.reason %}<span class="opacity-60">— {{ p.reason }}</span>{% endif %}
    </span>
  </label>
  {% endfor %}
  <div class="flex gap-2">
    <button class="btn btn-sm btn-primary" type="submit">Apply selected</button>
    <button class="btn btn-sm btn-ghost" type="button"
            onclick="this.closest('form').querySelectorAll('input[type=checkbox]').forEach(c => c.checked = false)">Clear all</button>
  </div>
</form>
{% endif %}
