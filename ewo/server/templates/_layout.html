<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ewo — {% block title %}{{ page }}{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="/static/theme.css" rel="stylesheet">
</head>
<body class="bg-base-200 min-h-screen">
  <div class="navbar bg-base-100 shadow px-4">
    <a class="text-xl font-bold mr-6" href="/">ewo</a>
    <ul class="menu menu-horizontal gap-1">
      {% for key, label, href in [
        ('dashboard', 'Today', '/'),
        ('tasks', 'Tasks', '/tasks'),
        ('labels', 'Labels', '/labels'),
        ('inbox', 'Inbox', '/inbox'),
        ('people', 'People', '/people'),
        ('jobs', 'Jobs', '/jobs'),
      ] %}
      <li><a href="{{ href }}" class="{% if page == key %}active{% endif %}">{{ label }}</a></li>
      {% endfor %}
    </ul>
  </div>
  <main class="container mx-auto p-4">
    {% block content %}{% endblock %}
  </main>
  <script>
    function pickParentTask(btn) {
      var picker = btn.closest(".parent-picker");
      picker.querySelector("input.parent-id").value = btn.getAttribute("data-id");
      picker.querySelector(".parent-label").textContent = btn.getAttribute("data-title");
      picker.querySelector("[id$='-parent-results']").innerHTML = "";
    }
    function clearParentTask(btn) {
      var picker = btn.closest(".parent-picker");
      picker.querySelector("input.parent-id").value = "";
      picker.querySelector(".parent-label").textContent = "none";
      picker.querySelector("[id$='-parent-results']").innerHTML = "";
    }
    (function () {
      var focusId = new URLSearchParams(window.location.search).get("focus");
      if (!focusId) return;
      var row = document.getElementById("task-" + focusId);
      if (!row) return;
      row.scrollIntoView({ behavior: "smooth", block: "center" });
      var detail = document.getElementById("task-" + focusId + "-detail");
      if (detail && window.htmx && detail.childElementCount === 0) {
        htmx.ajax("GET", "/gui/tasks/" + focusId + "/detail", { target: detail });
      }
    })();
  </script>
</body>
</html>
