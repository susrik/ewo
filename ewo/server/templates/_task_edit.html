<tr id="task-{{ task.id }}" class="bg-base-200">
  <td colspan="7">
    <form hx-post="/gui/tasks/{{ task.id }}" hx-target="#task-{{ task.id }}" hx-swap="outerHTML" class="grid gap-2">
      <input class="input input-bordered input-sm" name="title" value="{{ task.title }}" required>
      <textarea class="textarea textarea-bordered textarea-sm" name="description" rows="2" placeholder="Description">{{ task.description or "" }}</textarea>
      <div class="flex flex-wrap gap-2">
        <select class="select select-bordered select-sm" name="priority">
          {% for p in priorities %}<option value="{{ p.value }}" {% if p == task.priority %}selected{% endif %}>{{ p.value }}</option>{% endfor %}
        </select>
        <select class="select select-bordered select-sm" name="status">
          {% for s in statuses %}<option value="{{ s.value }}" {% if s == task.status %}selected{% endif %}>{{ s.value }}</option>{% endfor %}
        </select>
        <select class="select select-bordered select-sm" name="assignee_id">
          <option value="">(unassigned)</option>
          {% for person in people %}<option value="{{ person.id }}" {% if task.assignee_id == person.id %}selected{% endif %}>{{ person.name }}</option>{% endfor %}
        </select>
        <div id="task-{{ task.id }}-parent-picker">
          {% include "_parent_picker.html" %}
        </div>
        <input class="input input-bordered input-sm" type="date" name="start_date" title="Start date" value="{{ task.start_date.isoformat() if task.start_date else '' }}">
        <input class="input input-bordered input-sm" type="date" name="due_date" title="Due date" value="{{ task.due_date.isoformat() if task.due_date else '' }}">
        <input class="input input-bordered input-sm" name="tags" placeholder="tags" value="{{ task.tags | map(attribute='name') | join(', ') }}">
        <button class="btn btn-primary btn-sm" type="submit">Save</button>
        <button class="btn btn-sm" type="button" hx-get="/gui/tasks/{{ task.id }}" hx-target="#task-{{ task.id }}" hx-swap="outerHTML">Cancel</button>
      </div>
    </form>

    <div class="mt-2 grid gap-2">
      <div class="flex flex-wrap items-center gap-1">
        <span class="font-semibold text-xs">Jira tickets:</span>
        {% include "_task_jira.html" %}
      </div>
      <form hx-post="/gui/tasks/{{ task.id }}/merge" hx-target="#task-list" class="flex gap-2 items-center"
            hx-confirm="This deletes this task, moving its nuggets, notes, sub-tasks and links onto the selected task. Continue?">
        <select class="select select-bordered select-sm max-w-64" name="into_id" title="Merge this task into another" required>
          <option value="">Merge this task into…</option>
          {% for candidate in merge_candidates %}<option value="{{ candidate.id }}">#{{ candidate.id }} {{ candidate.title }}</option>{% endfor %}
        </select>
        <button class="btn btn-sm btn-warning" type="submit">Merge</button>
      </form>
      {% if llm_enabled %}
      <div>
        <div class="font-semibold text-xs mb-1">Split (AI)</div>
        <form hx-post="/gui/tasks/organize/split/propose" hx-target="#task-{{ task.id }}-split" class="grid gap-1">
          <input type="hidden" name="task_id" value="{{ task.id }}">
          <textarea class="textarea textarea-bordered textarea-sm w-full" name="instructions"
                    placeholder="Describe how to split this task into parts…"></textarea>
          <div>
            <button class="btn btn-sm" type="submit" title="AI proposes sub-tasks or sibling tasks from your instructions">Propose split</button>
          </div>
        </form>
        <div id="task-{{ task.id }}-split"></div>
      </div>
      {% endif %}
    </div>
  </td>
</tr>
